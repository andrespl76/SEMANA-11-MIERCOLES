{% extends 'catalogo/base.html' %}

{% block title %}{{ titulo }} - Mi Tienda{% endblock %}

{% block content %}
    <div style="text-align: center; padding: 4rem 0;">
        <span class="badge">Bienvenido</span>
        <h1 style="font-size: 2.5rem; margin-top: 1rem;">{{ titulo }}</h1>
        <p style="font-size: 1.2rem; color: #6B7280; max-width: 600px; margin: 1rem auto;">
            {{ mensaje }}
        </p>
        <a href="{% url 'catalogo:producto_list' %}" style="display: inline-block; background-color: var(--primary); color: white; padding: 0.75rem 1.5rem; border-radius: 8px; text-decoration: none; font-weight: 600; margin-top: 1rem;">
            Ver Catálogo Completo
        </a>
    </div>
{% endblock %}
