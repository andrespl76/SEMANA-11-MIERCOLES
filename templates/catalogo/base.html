<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Mi Tienda Django{% endblock %}</title>
    <!-- Fuente de Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        /* CSS Moderno y Atractivo */
        :root {
            --primary: #4F46E5;
            --primary-dark: #4338CA;
            --bg: #F3F4F6;
            --text: #1F2937;
            --card-bg: #FFFFFF;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            padding: 1rem 2rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        nav {
            display: flex;
            gap: 1.5rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: 600;
            transition: opacity 0.3s;
        }

        nav a:hover {
            opacity: 0.8;
        }

        main {
            flex: 1;
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 2rem;
            width: 100%;
        }

        footer {
            background-color: var(--text);
            color: white;
            text-align: center;
            padding: 1rem;
            margin-top: auto;
        }

        h1, h2 {
            margin-bottom: 1rem;
            color: var(--text);
        }

        .grid-productos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s, box-shadow 0.3s;
            border-top: 5px solid var(--primary);
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .card h3 {
            font-size: 1.25rem;
            margin-bottom: 0.5rem;
        }

        .precio {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--primary);
            margin-top: 1rem;
        }

        .badge {
            display: inline-block;
            background-color: #E0E7FF;
            color: var(--primary-dark);
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <header>
        <nav>
            <a href="{% url 'catalogo:home' %}">🏠 Inicio</a>
            <a href="{% url 'catalogo:producto_list' %}">📦 Catálogo</a>
        </nav>
    </header>

    <main>
        <!-- Los bloques permiten que las plantillas hijas inyecten contenido -->
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>&copy; {{ anio|default:"2026" }} - Desarrollo de Aplicaciones Web - UNCP</p>
    </footer>

</body>
</html>
